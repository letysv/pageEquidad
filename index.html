	<script type="module">
		const URL_BASE = 'http://127.0.0.1:8000/';
		// const URL_BASE = 'https://legisver.gob.mx/sitioAdminFiscalizacion/';

		const URL_API_EQUIPOS = URL_BASE + 'api/equipos';

		const URL_API_NOTAS = URL_BASE + 'api/notas';
		const URL_API_NOTA = URL_BASE + 'api/nota';

		const URL_API_PUBLICACIONES = URL_BASE + 'api/publicaciones';

		const URL_API_CATEGORIAS = URL_BASE + 'api/categorias';
		const URL_API_BIBLIOTECA = URL_BASE + 'api/biblioteca';

		const URL_API_EFEMERIDES = URL_BASE + 'api/efemerides';

		const URL_API_INFORMES = URL_BASE + 'api/informes';

		const URL_API_ENLACES = URL_BASE + 'api/enlaces';

		const URL_API_ACTIVIDADES = URL_BASE + 'api/actividades';

		const URL_FILES_EQUIPO = URL_BASE + 'storage/equipo/';

		const URL_FILES_NOTAS = URL_BASE + 'storage/notas/';
		const URL_FILES_ICONOS = URL_BASE + 'storage/iconos/';

		const URL_FILES_PUBLICACIONES = URL_BASE + 'storage/publicaciones/';

		const URL_FILES_BIBLIOTECA = URL_BASE + 'storage/biblioteca/';

		const URL_FILES_EFEMERIDES = URL_BASE + 'storage/efemerides/';

		const URL_FILES_INFORMES = URL_BASE + 'storage/informes/';

		const URL_FILES_ACTIVIDADES = URL_BASE + 'storage/actividades/';

		import * as carousel from './resources/views/carousell.js';
		import * as equipo from './resources/views/equipo.js';
		import * as notas from './resources/views/notas.js';
		import * as publicaciones from './resources/views/publicaciones.js';
		import * as biblioteca from './resources/views/biblioteca.js';
		import * as efemerides from './resources/views/efemerides.js';
		import * as informes from './resources/views/informes.js';
		import * as enlaces from './resources/views/enlaces.js';
		import * as actividades from './resources/views/actividades.js';

		$(document).ready(function () {

        	const defaultContent = `
            	<header class="major">
                	<h2>¿Qué es el Centro de Estudios Para la Igualdad de Género y Derechos Humanos?</h2>
                </header>
                <div id="data_container" class="default-content">
                    <p>
                	    El Centro de Estudios para la Igualdad de Género y Derechos Humanos, es una instancia dentro de la estructura administrativa del Congreso del Estado
						de Veracruz, adscrita a la Secretaria General.
                    </p>
					<p>
                	    Con el marco legal que sale de la Ley Orgánica del Poder Legislativo Artículo 57 Fracción XI inciso i y del Reglamento Interno Artículo 7 Fracción I 
						inciso j, Artículo 8 Bis, Artículo 13 Bis y Artículo 31 Bis.
                    </p>
					<p>
                	    La función general del Centro es la de formular estudios o investigaciones sobre la situación o condición de las mujeres en todos los ámbitos de la
						sociedad, a fin de apoyar en forma objetiva, imparcial y oportuna el trabajo legislativo, mediante la información analítica y servicios de apoyo 
						técnicos, que contribuyan a promover los derechos humanos, el adelanto de las mujeres y la igualdad de género.
                    </p>
					<p>
                	    A su vez las atribuciones del centro son las siguientes:
                    </p>
                    <ul>
                        <li>Desarrollar, formular, coordinar y supervisar la información estadística, jurídica, histórica, económica, política y social, que desde una 
							perspectiva de los derechos humanos y de género, permita orientar y acompañar el trabajo legislativo.</li>
                        <li>Acompañar las iniciativas legislativas.</li>
                        <li>Apoyar el diseño de reformas legislativas para lograr la participación entre mujeres y hombres en condiciones de igualdad.</li>
						<li>Contribuir al seguimiento de las políticas públicas.</li>
						<li>Integrar y coordinar bases de datos, sobre el tema de derechos humanos y género.</li>
						<li>Crear indicadores de género para apoyar los trabajos de las comisiones legislativas.</li>
						<li>Ofrecemos capacitación permanente con enfoque de derechos humanos.</li>
						<liPromover seminarios, cursos, talleres, reuniones académicas o foros.</li>
						<li>Difundir, en coordinación con las áreas correspondientes del congreso, temas relacionados con los derechos humanos, el adelanto de las mujeres
							y la perspectiva de género.</li>
						<li>Las demás que la ley y la normatividad del congreso del estado le señalen.</li>
                    </ul>
                </div>
            `;

            function mostrarContenidoInicial() {
            	$('#main_container').html(defaultContent);
            }

            function activarEnlace($enlace) {
                $('#menu-modulos a').removeClass('active');
                $enlace.addClass('active');
            }

            const equipoSettings = {
                url_apiEquipos: URL_API_EQUIPOS,
                url_filesEquipo: URL_FILES_EQUIPO,
                main_container: 'main_container',
                datacontainer: 'data_container',
                title: 'Equipo CEIGyDH'
            };

			const notasSettings = {
				url_apiNotas: URL_API_NOTAS,
				url_filesNotas:URL_FILES_NOTAS,
				url_apiNota:URL_API_NOTA,
				main_container: 'main_container',
                datacontainer: 'data_container',
                title: 'Notas'
			}

			const publicacionesSettings = {
				url_apiPublicaciones: URL_API_PUBLICACIONES,
				url_filesPublicaciones:URL_FILES_PUBLICACIONES,
				main_container: 'main_container',
                datacontainer: 'data_container',
                title: 'Publicaciones y material de apoyo'
			}

			const bibliotecaSettings = {
				url_apiCategorias: URL_API_CATEGORIAS,
				url_apiBiblioteca: URL_API_BIBLIOTECA,
				url_filesBiblioteca:URL_FILES_BIBLIOTECA,
				main_container: 'main_container',
                datacontainer: 'data_container',
                title: 'Biblioteca virtual'
			}

			const efemeridesSettings = {
				url_apiEfemerides: URL_API_EFEMERIDES,
				url_filesEfemerides:URL_FILES_EFEMERIDES,
				main_container: 'main_container',
                datacontainer: 'data_container',
                title: 'Efemérides'
			}

			const informesSettings = {
				url_apiInformes: URL_API_INFORMES,
				url_filesInformes:URL_FILES_INFORMES,
				main_container: 'main_container',
                datacontainer: 'data_container',
                title: 'Informes legislativos'
			}

			const enlacesSettings = {
				url_apiEnlaces: URL_API_ENLACES,
				main_container: 'main_container',
                datacontainer: 'data_container',
                title: 'Enlaces recomendados'
			}

			const actividadesSettings = {
				url_apiActividades: URL_API_ACTIVIDADES,
				url_filesActividades:URL_FILES_ACTIVIDADES,
				main_container: 'main_container',
                datacontainer: 'data_container',
                title: 'Actividades realizadass'
			}

			mostrarContenidoInicial();
            activarEnlace($('#menu-modulos a[href="#Inicio"]'));

            // cargar carrusel de imágenes
            const carouselSettings = {
                url_api: URL_API_NOTAS,
                url_filesNotas: URL_FILES_NOTAS,
                url_apiNotas: URL_API_NOTAS,
                url_apiNota: URL_API_NOTA,
                container: 'banner-carousel'
            };
            carousel.crear(carouselSettings);

            $('#menu-modulos a').on('click', function (event) {
                const destino = $(this).attr('href');

                if (destino === '#Inicio') {
                    event.preventDefault();
                    activarEnlace($(this));
                    mostrarContenidoInicial();
            	} else if (destino === '#Equipo') {
                    event.preventDefault();
                    activarEnlace($(this));
                    equipo.muestra(equipoSettings);
                } else if (destino === '#Notas') {
                    event.preventDefault();
                    activarEnlace($(this));
                    notas.muestra(notasSettings);
				} else if (destino === '#Publicaciones') {
                    event.preventDefault();
                    activarEnlace($(this));
                    publicaciones.muestra(publicacionesSettings);
				} else if (destino === '#Biblioteca') {
                    event.preventDefault();
                    activarEnlace($(this));
                    biblioteca.muestra(bibliotecaSettings);
				} else if (destino === '#Efemerides') {
                    event.preventDefault();
                    activarEnlace($(this));
                    efemerides.muestra(efemeridesSettings);
				} else if (destino === '#Informes') {
                    event.preventDefault();
                    activarEnlace($(this));
                    informes.muestra(informesSettings);
				} else if (destino === '#Enlaces') {
                    event.preventDefault();
                    activarEnlace($(this));
                    enlaces.muestra(enlacesSettings);
				} else if (destino === '#Actividades') {
                    event.preventDefault();
                    activarEnlace($(this));
                    actividades.muestra(actividadesSettings);
                } else {
                    event.preventDefault();
                    activarEnlace($(this));
                    const titulo = $(this).text();
                    $('#main_container').html(`
                        <header class="major">
                            <h2>${titulo}</h2>
                        </header>
                    	<div class="alert alert-secondary" role="alert">
                        	El contenido de <strong>${titulo}</strong> estará disponible próximamente.
                        </div>
                    `);
                }
            });
	});
	</script>
